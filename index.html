<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>擴大灌溉服務組織課程平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fs-scale:1.2;
    --color-primary:#0B3D62;
    --color-primary-dark:#082C47;
    --color-primary-tint:#E6ECF1;
    --color-green:#3C7A5D;
    --color-green-tint:#E7EFE9;
    --color-teal:#1B6B77;
    --color-teal-tint:#E5EEEF;
    --color-gold:#C99A2E;
    --color-bg:#F6F5F1;
    --color-bg-alt:#EFEEE6;
    --color-ink:#1E2B29;
    --color-ink-soft:#55625D;
    --color-border:#D8DED5;
    --color-white:#FFFFFF;
    --serif: "Noto Serif TC", serif;
    --sans: "Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    color:var(--color-ink);
    background:var(--color-bg);
    line-height:1.55;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  button{font-family:var(--sans);}
  .skip-link{
    position:absolute;left:-999px;top:0;background:var(--color-gold);color:#1E2B29;
    padding:10px 16px;z-index:400;font-weight:700;
  }
  .skip-link:focus{left:8px;top:8px;}

  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  /* ---------- utility bar ---------- */
  .util-bar{background:var(--color-primary-dark);color:#CFDCE6;font-size:calc(11.5px * var(--fs-scale));flex:0 0 auto;}
  .util-inner{
    max-width:1280px;margin:0 auto;padding:4px 22px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .util-left span{margin-right:14px;opacity:.85;}
  .util-right{display:flex;gap:12px;align-items:center;}
  .util-right button{
    background:none;border:1px solid rgba(255,255,255,.35);color:#CFDCE6;
    font-size:calc(10.5px * var(--fs-scale));padding:1px 7px;border-radius:2px;cursor:pointer;
  }
  .util-right button:hover{border-color:var(--color-gold);color:#fff;}

  /* ---------- brand row ---------- */
  .brand-row{background:var(--color-white);border-bottom:1px solid var(--color-border);flex:0 0 auto;}
  .brand-inner{
    max-width:1280px;margin:0 auto;padding:9px 22px;
    display:flex;align-items:center;gap:14px;
  }
  .emblem{
    width:38px;height:38px;border-radius:50%;background:var(--color-primary);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid var(--color-gold);
  }
  .emblem svg{width:22px;height:22px;}
  .brand-text .agency-zh{font-family:var(--serif);font-weight:700;font-size:calc(16.5px * var(--fs-scale));color:var(--color-primary);}
  .brand-text .agency-en{font-size:calc(10px * var(--fs-scale));color:var(--color-ink-soft);letter-spacing:1px;}
  .brand-right{margin-left:auto;font-size:calc(12px * var(--fs-scale));color:var(--color-ink-soft);display:none;}
  @media(min-width:700px){.brand-right{display:block;}}

  /* ---------- tab switcher ---------- */
  .tab-switcher{
    flex:0 0 auto;background:var(--color-primary);
    display:flex;justify-content:center;gap:6px;padding:9px 16px;
    border-bottom:3px solid var(--color-gold);
  }
  .tab-btn{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
    color:#DCE6EC;padding:8px 18px;border-radius:3px;cursor:pointer;font-size:calc(14px * var(--fs-scale));font-weight:500;
    transition:background .15s ease;
  }
  .tab-btn svg{width:18px;height:18px;flex-shrink:0;}
  .tab-btn .count{
    background:rgba(255,255,255,.18);border-radius:999px;font-size:calc(11px * var(--fs-scale));padding:1px 8px;
  }
  .tab-btn:hover{background:rgba(255,255,255,.14);}
  .tab-btn.active{background:var(--color-gold);border-color:var(--color-gold);color:#20180A;}
  .tab-btn.active .count{background:rgba(0,0,0,.15);}

  /* ---------- content ---------- */
  .content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;}
  .panel{flex:1;min-height:0;display:none;flex-direction:column;padding:14px 0 10px;}
  .panel.active{display:flex;}
  .panel-head{
    max-width:1280px;width:100%;margin:0 auto;padding:0 26px 10px;
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;
  }
  .panel-title{font-family:var(--serif);font-weight:700;font-size:calc(16.5px * var(--fs-scale));}
  .panel-desc{font-size:calc(12px * var(--fs-scale));color:var(--color-ink-soft);}

  .carousel-wrap{position:relative;flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;padding:0 26px;}
  .carousel-track{
    display:flex;gap:18px;height:100%;overflow-x:auto;scroll-snap-type:x proximity;
    scrollbar-width:none;padding:2px 2px 8px;
  }
  .carousel-track::-webkit-scrollbar{display:none;}
  .arrow-btn{
    position:absolute;top:50%;transform:translateY(-50%);z-index:10;
    width:36px;height:36px;border-radius:50%;border:1px solid var(--color-border);
    background:rgba(255,255,255,.95);cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(11,61,98,.18);
  }
  .arrow-btn:hover{background:var(--color-primary);border-color:var(--color-primary);}
  .arrow-btn:hover svg{stroke:#fff;}
  .arrow-btn svg{width:18px;height:18px;stroke:var(--color-primary);}
  .arrow-btn.left{left:2px;}
  .arrow-btn.right{right:2px;}
  .arrow-btn[hidden]{display:none;}

  /* ---------- video card ---------- */
  .video-card{
    flex:0 0 auto;width:min(270px,78vw);scroll-snap-align:start;
    background:var(--color-white);border:1px solid var(--color-border);
    display:flex;flex-direction:column;height:100%;max-height:460px;
    transition:box-shadow .15s ease,border-color .15s ease;
  }
  .video-card:hover{box-shadow:0 6px 16px rgba(11,61,98,.16);border-color:var(--color-primary);}
  .thumb-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--color-bg-alt);cursor:pointer;flex:0 0 auto;}
  .thumb-wrap img{width:100%;height:100%;object-fit:cover;}
  .play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,32,45,.16);}
  .play-badge svg{width:38px;height:38px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .duration-badge{
    position:absolute;right:7px;bottom:7px;background:rgba(9,20,28,.78);color:#fff;
    font-size:calc(11px * var(--fs-scale));padding:1px 6px;border-radius:2px;
  }
  .card-body{padding:11px 14px 13px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;}
  .tag-chip{align-self:flex-start;font-size:calc(10.5px * var(--fs-scale));padding:2px 8px;border-radius:2px;font-weight:500;}
  .tag-chip.green{background:var(--color-green-tint);color:var(--color-green);}
  .tag-chip.teal{background:var(--color-teal-tint);color:var(--color-teal);}
  .card-title{font-family:var(--serif);font-weight:700;font-size:calc(14.5px * var(--fs-scale));line-height:1.4;}
  .card-desc{font-size:calc(12px * var(--fs-scale));color:var(--color-ink-soft);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .card-foot{
    display:flex;justify-content:space-between;align-items:center;font-size:calc(11.5px * var(--fs-scale));
    padding-top:6px;border-top:1px solid var(--color-border);color:var(--color-ink-soft);
  }
  .watch-link{color:var(--color-primary);font-weight:500;}
  .video-card:hover .watch-link{text-decoration:underline;}

  .video-card.placeholder{border-style:dashed;}
  .placeholder .thumb-wrap{
    background:repeating-linear-gradient(135deg,var(--color-bg-alt) 0 10px,#E4E2D8 10px 20px);
    display:flex;align-items:center;justify-content:center;cursor:default;
  }
  .placeholder .thumb-wrap svg{width:32px;height:32px;opacity:.35;}
  .placeholder .card-title{color:var(--color-ink-soft);}

  /* ---------- footer ---------- */
  .app-footer{
    flex:0 0 auto;background:var(--color-primary-dark);color:#9FB3BF;font-size:calc(11px * var(--fs-scale));
    display:flex;justify-content:space-between;align-items:center;padding:6px 22px;flex-wrap:wrap;gap:4px;
  }
  .footer-links{display:flex;gap:14px;}
  .footer-links button{background:none;border:none;color:#9FB3BF;font-size:calc(11px * var(--fs-scale));cursor:pointer;padding:0;}
  .footer-links button:hover{color:var(--color-gold);text-decoration:underline;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(9,20,28,.75);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:300;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;max-width:680px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .video-frame{width:100%;aspect-ratio:16/9;background:#000;}
  .video-frame iframe{width:100%;height:100%;border:0;display:block;}
  .modal-content{padding:18px 22px 20px;}
  .modal-tag{font-size:calc(11px * var(--fs-scale));color:var(--color-green);font-weight:700;margin-bottom:6px;display:block;}
  .modal-content h3{font-family:var(--serif);margin:0 0 6px;font-size:calc(17px * var(--fs-scale));}
  .modal-content p{font-size:calc(13px * var(--fs-scale));color:var(--color-ink-soft);margin:0;}
  .modal-close{
    margin-top:14px;background:var(--color-primary);color:#fff;border:none;
    padding:8px 18px;font-size:calc(13px * var(--fs-scale));cursor:pointer;
  }
  .modal-close:hover{background:var(--color-primary-dark);}
  .info-modal-content{padding:24px 26px;font-size:calc(13.5px * var(--fs-scale));color:var(--color-ink-soft);}
  .info-modal-content h3{font-family:var(--serif);color:var(--color-ink);margin:0 0 12px;font-size:calc(18px * var(--fs-scale));}
  .info-modal-content p{margin:0 0 10px;}

  @media(max-width:640px){
    .brand-right{display:none;}
    .util-left span:last-child{display:none;}
    .video-card{width:min(240px,72vw);}
  }
</style>
</head>
<body>
<a class="skip-link" href="#tabpanels" data-i18n="skipLink">跳到主要內容</a>

<div class="app">

  <div class="util-bar">
    <div class="util-inner">
      <div class="util-left">
        <span data-i18n="orgName">台灣水資源與農業研究院</span>
        <span data-i18n="programName">114 年度擴大灌溉服務組織管理及行政輔導研析計畫</span>
      </div>
      <div class="util-right">
        <span data-i18n="fontSizeLabel" style="opacity:.75;">字級</span>
        <button type="button" id="fontDec" aria-label="縮小字級">A-</button>
        <button type="button" id="fontReset" aria-label="重設字級">A</button>
        <button type="button" id="fontInc" aria-label="放大字級">A+</button>
      </div>
    </div>
  </div>

  <div class="brand-row">
    <div class="brand-inner">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3C9 7 6 10.5 6 14a6 6 0 0012 0c0-3.5-3-7-6-11z" stroke="#F3F1E8" stroke-width="1.6" fill="#F3F1E8" fill-opacity=".15"/><path d="M12 3C9 7 6 10.5 6 14a6 6 0 0012 0c0-3.5-3-7-6-11z" stroke="#F3F1E8" stroke-width="1.6"/></svg>
      </div>
      <div class="brand-text">
        <div class="agency-zh" data-i18n="agencyTitle">擴大灌溉服務組織課程平台</div>
      </div>
    </div>
  </div>

  <nav class="tab-switcher" role="tablist" aria-label="課程分類">
    <button class="tab-btn" id="btn-facility" role="tab" data-tab="facility" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M8 6V4h8v2M3 11h18"/></svg>
      <span data-i18n="tabFacility">設施管理</span> <span class="count">2</span>
    </button>
    <button class="tab-btn active" id="btn-capacity" role="tab" data-tab="capacity" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.8-3.6 3.6-6 7-6s6.2 2.4 7 6"/></svg>
      <span data-i18n="tabCapacity">組織培力</span> <span class="count">4</span>
    </button>
  </nav>

  <main class="content" id="tabpanels">

    <section class="panel" id="panel-facility">
      <div class="panel-head">
        <span class="panel-title" data-i18n="panelTitleFacility">設施管理</span>
        <span class="panel-desc" data-i18n="panelDescFacility">灌溉渠道與設施之日常維護、巡查與管理實務</span>
      </div>
      <div class="carousel-wrap">
        <button class="arrow-btn left" data-target="facility" hidden aria-label="上一部">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="carousel-track" id="track-facility"></div>
        <button class="arrow-btn right" data-target="facility" hidden aria-label="下一部">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

    <section class="panel active" id="panel-capacity">
      <div class="panel-head">
        <span class="panel-title" data-i18n="panelTitleCapacity">組織培力</span>
        <span class="panel-desc" data-i18n="panelDescCapacity">組織治理、財務與數位轉型相關實務課程</span>
      </div>
      <div class="carousel-wrap">
        <button class="arrow-btn left" data-target="capacity" hidden aria-label="上一部">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="carousel-track" id="track-capacity"></div>
        <button class="arrow-btn right" data-target="capacity" hidden aria-label="下一部">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <span data-i18n="footerCopyright">© 2026 台灣水資源與農業研究院｜新北市淡水區中正東路二段27之8號19樓｜(02) 2809-3497</span>
    <div class="footer-links">
      <button type="button" data-info="about" data-i18n="footerAbout">關於本計畫</button>
      <button type="button" data-info="policy" data-i18n="footerPolicy">政策連結</button>
    </div>
  </footer>

</div>

<!-- video modal -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-box">
    <div class="video-frame"><iframe id="videoFrame" src="" title="課程影片播放" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
    <div class="modal-content">
      <span class="modal-tag" id="modalTag">組織培力</span>
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
      <button class="modal-close" id="videoModalClose" data-i18n="closeBtn">關閉</button>
    </div>
  </div>
</div>

<!-- info modal -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-box">
    <div class="info-modal-content" id="infoModalContent"></div>
  </div>
</div>

<script>
/* ---------- i18n dictionary ---------- */
const translations = {
  skipLink:{ zh:"跳到主要內容", en:"Skip to main content" },
  orgName:{ zh:"台灣水資源與農業研究院", en:"Taiwan Research Institute of Water Resources and Agriculture" },
  programName:{ zh:"114 年度擴大灌溉服務組織管理及行政輔導研析計畫", en:"FY114 Expanded Irrigation Service Organization Management and Administrative Guidance Project" },
  fontSizeLabel:{ zh:"字級", en:"Text size" },
  agencyTitle:{ zh:"擴大灌溉服務組織課程平台", en:"Expanded Irrigation Service Organization Course Platform" },
  tabFacility:{ zh:"設施管理", en:"Facility Management" },
  tabCapacity:{ zh:"組織培力", en:"Organization Capacity Building" },
  panelTitleFacility:{ zh:"設施管理", en:"Facility Management" },
  panelDescFacility:{ zh:"灌溉渠道與設施之日常維護、巡查與管理實務", en:"Routine maintenance, inspection, and management practices for irrigation channels and facilities." },
  panelTitleCapacity:{ zh:"組織培力", en:"Organization Capacity Building" },
  panelDescCapacity:{ zh:"組織治理、財務與數位轉型相關實務課程", en:"Practical courses on organizational governance, finance, and digital transformation." },
  footerCopyright:{ zh:"© 2026 台灣水資源與農業研究院｜新北市淡水區中正東路二段27之8號19樓｜(02) 2809-3497", en:"© 2026 Taiwan Research Institute of Water Resources and Agriculture | 19F, No. 27-8, Sec. 2, Zhongzheng E. Rd., Tamsui Dist., New Taipei City | (02) 2809-3497" },
  footerAbout:{ zh:"關於本計畫", en:"About This Program" },
  footerPolicy:{ zh:"政策連結", en:"Policy Links" },
  closeBtn:{ zh:"關閉", en:"Close" },
  durationLabel:{ zh:"時長", en:"Duration" },
  onlineCourseLabel:{ zh:"線上課程", en:"Online Course" },
  watchLabel:{ zh:"觀看課程 ›", en:"Watch course ›" }
};

let currentLang = "zh";

/* ---------- video data (bilingual) ---------- */
const capacityVideos = [
  { id:"legal", title:{zh:"用水組織之定位與合法性", en:"Legal Status and Legitimacy of Water-Use Organizations"},
    desc:{zh:"說明農田水利相關用水組織之法律定位、組織性質與合法性認定原則。",

const tagLabels = {
  capacity:{ zh:"組織培力", en:"Organization Capacity Building" },
  facility:{ zh:"設施管理", en:"Facility Management" }
};

function renderCards(list, trackId, tagKey, tagClass){
  const track = document.getElementById(trackId);
  track.innerHTML = "";
  list.forEach(v=>{
    const card = document.createElement("article");
    card.className = "video-card";
    const durationText = v.duration ? v.duration : "";
    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${v.img}" alt="${v.title[currentLang]}">
        <div class="play-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.92)"><circle cx="12" cy="12" r="11" fill="rgba(9,32,45,0.55)"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg>
        </div>
        ${durationText ? `<span class="duration-badge">${durationText}</span>` : ""}
      </div>
      <div class="card-body">
        <span class="tag-chip ${tagClass}">${tagLabels[tagKey][currentLang]}</span>
        <div class="card-title">${v.title[currentLang]}</div>
        <p class="card-desc">${v.desc[currentLang]}</p>
        <div class="card-foot">
          <span>${durationText ? translations.durationLabel[currentLang]+" "+durationText : translations.onlineCourseLabel[currentLang]}</span>
          <span class="watch-link">${translations.watchLabel[currentLang]}</span>
        </div>
      </div>
    `;
    card.addEventListener("click", ()=>openVideo(v, tagKey));
    track.appendChild(card);
  });
}
function renderAllCards(){
  renderCards(capacityVideos, "track-capacity", "capacity", "green");
  renderCards(facilityVideos, "track-facility", "facility", "teal");
  updateArrows();
}
renderAllCards();

const videoModal = document.getElementById("videoModal");
const videoFrame = document.getElementById("videoFrame");
function openVideo(v, tagKey){
  videoFrame.src = `https://www.youtube-nocookie.com/embed/${v.yt}?autoplay=1&rel=0`;
  document.getElementById("modalTag").textContent = tagLabels[tagKey][currentLang];
  document.getElementById("modalTitle").textContent = v.title[currentLang];
  document.getElementById("modalDesc").textContent = v.desc[currentLang];
  videoModal.classList.add("open");
}
function closeVideo(){
  videoModal.classList.remove("open");
  videoFrame.src = "";
}
document.getElementById("videoModalClose").addEventListener("click", closeVideo);
videoModal.addEventListener("click", (e)=>{ if(e.target===videoModal) closeVideo(); });

/* ---------- language toggle ---------- */
function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(translations[key]) el.textContent = translations[key][lang];
  });
  renderAllCards();
}

/* ---------- font size scaling ---------- */
const DEFAULT_FS_SCALE = 1.2;
let fsScale = DEFAULT_FS_SCALE;
function applyFontScale(){
  document.documentElement.style.setProperty("--fs-scale", fsScale.toFixed(2));
}
applyFontScale();
document.getElementById("fontDec").addEventListener("click", ()=>{
  fsScale = Math.max(0.9, +(fsScale - 0.1).toFixed(2));
  applyFontScale();
});
document.getElementById("fontInc").addEventListener("click", ()=>{
  fsScale = Math.min(1.6, +(fsScale + 0.1).toFixed(2));
  applyFontScale();
});
document.getElementById("fontReset").addEventListener("click", ()=>{
  fsScale = DEFAULT_FS_SCALE;
  applyFontScale();
});

/* tab switching */
const tabBtns = document.querySelectorAll(".tab-btn");
tabBtns.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    tabBtns.forEach(b=>{b.classList.remove("active"); b.setAttribute("aria-selected","false");});
    btn.classList.add("active"); btn.setAttribute("aria-selected","true");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
    updateArrows();
  });
});

/* carousel arrows */
function updateArrows(){
  document.querySelectorAll(".carousel-wrap").forEach(wrap=>{
    const trackEl = wrap.querySelector(".carousel-track");
    const left = wrap.querySelector(".arrow-btn.left");
    const right = wrap.querySelector(".arrow-btn.right");
    if(!trackEl.offsetParent){ return; }
    const overflow = trackEl.scrollWidth > trackEl.clientWidth + 4;
    left.hidden = !overflow || trackEl.scrollLeft <= 4;
    right.hidden = !overflow || trackEl.scrollLeft >= trackEl.scrollWidth - trackEl.clientWidth - 4;
  });
}
document.querySelectorAll(".arrow-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const t = document.getElementById("track-"+btn.dataset.target);
    const dir = btn.classList.contains("left") ? -1 : 1;
    t.scrollBy({left: dir * (t.clientWidth*0.85), behavior:"smooth"});
    setTimeout(updateArrows, 350);
  });
});
document.querySelectorAll(".carousel-track").forEach(t=>t.addEventListener("scroll", updateArrows));
window.addEventListener("resize", updateArrows);
window.addEventListener("load", updateArrows);
setTimeout(updateArrows, 200);

infoModal.addEventListener("click",(e)=>{ if(e.target===infoModal) infoModal.classList.remove("open"); });
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ closeVideo(); infoModal.classList.remove("open"); } });
</script>
